<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101510">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BreathBuddy">
<title>Breath//Buddy</title>
<style>
:root{--bg:#101510;--lcd:#cad9ae;--ink:#1a291e;--mid:#627957;--panel:#b7c99b}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:"Courier New",monospace;color:var(--ink);min-height:100vh;display:flex;justify-content:center;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}.app{width:min(100%,430px);padding:14px 0 22px}.lcd{background:var(--lcd);border:5px solid var(--mid);border-radius:15px;min-height:610px;padding:15px;box-shadow:inset 0 0 0 3px var(--ink)}header{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--ink);padding:3px 4px 10px;font-weight:bold}.brand{font-size:20px}.small{font-size:11px}.screen{padding:15px 3px 8px;min-height:475px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.title{text-align:center;font-size:22px;font-weight:bold;margin:5px 0 14px}.pint-wrap{text-align:center;margin:8px auto}.pint{width:135px;height:190px;margin:auto;position:relative;clip-path:polygon(4% 0,96% 0,83% 100%,17% 100%);background:var(--lcd);border:0}.pint:before{content:"";position:absolute;inset:0;background:var(--ink);clip-path:polygon(0 0,100% 0,87% 100%,13% 100%,17% 96%,82% 96%,94% 4%,6% 4%)}.inner{position:absolute;left:9px;right:9px;top:8px;bottom:8px;clip-path:polygon(0 0,100% 0,86% 100%,14% 100%);background:var(--lcd);overflow:hidden}.beer{position:absolute;bottom:0;left:0;right:0;background:var(--mid);transition:height .5s}.foam{position:absolute;left:0;right:0;height:14px;background:var(--lcd);top:-5px;border-bottom:5px dotted var(--ink)}.face{position:absolute;left:0;right:0;bottom:42px;text-align:center;font-size:34px;font-weight:bold;z-index:3;letter-spacing:2px}.shine{position:absolute;width:5px;background:var(--mid);height:110px;left:23px;top:25px;transform:rotate(-4deg);opacity:.8}.statusbox{border:3px solid var(--ink);padding:10px;margin-top:12px}.big{font-size:24px;font-weight:bold}.center{text-align:center}.muted{color:var(--mid);font-weight:bold}.timer{font-size:28px;font-weight:bold}.menu button,.actions button{width:100%;font:700 16px "Courier New",monospace;border:3px solid var(--ink);background:transparent;color:var(--ink);padding:14px 10px;margin:7px 0;text-align:left;border-radius:0}.menu button:active,.actions button:active{background:var(--ink);color:var(--lcd)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions button{text-align:center}.primary{background:var(--ink)!important;color:var(--lcd)!important}.die{width:110px;height:110px;border:5px solid var(--ink);margin:20px auto;display:grid;place-items:center;font-size:54px;font-weight:bold}.drink{font-size:25px;font-weight:bold;text-align:center;margin:18px 0}.footer{border-top:3px solid var(--ink);padding-top:9px;margin-top:9px;font-size:11px;font-weight:bold}.dead{filter:grayscale(1);opacity:.65}.hidden{display:none}.device-lock{position:fixed;inset:0;background:var(--bg);z-index:9998;display:flex;align-items:center;justify-content:center;padding:20px}.device-lock.hidden{display:none}.lock-lcd{width:min(100%,430px);background:var(--lcd);border:5px solid var(--mid);box-shadow:inset 0 0 0 3px var(--ink);border-radius:15px;padding:26px 18px;text-align:center}.lock-brand{font-size:25px;font-weight:bold;border-bottom:3px solid var(--ink);padding-bottom:14px;margin-bottom:28px}.lock-icon{font-size:58px;margin:15px}.lock-state{font-size:20px;font-weight:bold;margin:16px 0}.lock-dots{font-size:25px;letter-spacing:7px;margin:20px 0}.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--lcd);border:3px solid var(--mid);padding:10px 14px;font-weight:bold;z-index:9999;box-shadow:0 3px 0 var(--mid);max-width:90%;text-align:center}.progress{height:25px;border:3px solid var(--ink);padding:3px;margin:25px 15px}.progress>div{height:100%;background:var(--mid);width:0}.note{font-size:11px;line-height:1.4}.pill{border:2px solid var(--ink);padding:5px 8px;font-size:11px;font-weight:bold} @media(max-width:360px){.lcd{min-height:570px}.screen{min-height:440px}.pint{width:115px;height:165px}.brand{font-size:17px}}
</style>
</head>
<body><div id="deviceLock" class="device-lock"><div class="lock-lcd"><div class="lock-brand">BREATH//BUDDY</div><div class="lock-icon">🍺</div><div id="lockState" class="lock-state">SEARCHING FOR BREATHBUDDY...</div><div id="lockDots" class="lock-dots">■ ■ ■ □ □</div><p class="note">Turn on your BreathBuddy device<br>and keep it nearby.</p><p id="lockDetail" class="small muted">DEVICE REQUIRED</p></div></div><main class="app"><section class="lcd"><header><span class="brand">BREATH//BUDDY</span><span class="small">WEB v0.9.2</span></header><div id="screen" class="screen"></div><div id="footer" class="footer">READY</div></section></main>
<script>
const states=[
 {name:'NOT DRUNK',fill:16,mood:'Sober and steady.',face:'^‿^'},
 {name:'TIPSY',fill:34,mood:'A bit loose.',face:'^◡~'},
 {name:'BUZZED',fill:54,mood:'Feeling it.',face:'•ᴗ•'},
 {name:'DRUNK',fill:75,mood:'Properly drunk.',face:'×﹏×'},
 {name:'BLASTED',fill:94,mood:'Absolute chaos.',face:'◎﹏◎'}];
const drinks=[['Beer',20],['Cider',15],['Ginger Beer',12],['Gin & Tonic',11],['Rum & Coke',10],['Vodka Lime',8],['Vodka Cruiser',7],['Red Wine',6],['White Wine',5],['Whisky',3],['Tequila Shot',2],['Rum',1]];
let page='home',state=0,lastDrink='NO DRINK ROLLED',deadline=null,analysed=false,rolling=false;
let bleDevice=null,bleCharacteristic=null,bleConnected=false,waitingForReading=false;
const SERVICE_UUID='12345678-1234-1234-1234-123456789000';
const CHARACTERISTIC_UUID='12345678-1234-1234-1234-123456789001';
const el=document.getElementById('screen'),foot=document.getElementById('footer');
const deviceLock=document.getElementById('deviceLock'),lockState=document.getElementById('lockState'),lockDetail=document.getElementById('lockDetail');
function setDeviceLock(mode,detail=''){
  if(mode==='connected'){
    bleConnected=true; deviceLock.classList.add('hidden'); lockState.textContent='CONNECTED'; lockDetail.textContent=detail||'BREATHBUDDY READY'; render(); toast('🍺 BREATHBUDDY CONNECTED'); return;
  }
  bleConnected=false; deviceLock.classList.remove('hidden');
  if(mode==='connecting'){lockState.textContent='BREATHBUDDY FOUND';lockDetail.textContent=detail||'CONNECTING...';}
  else if(mode==='disconnected'){lockState.textContent='CONNECTION LOST';lockDetail.textContent=detail||'TAP TO RECONNECT';}
  else {lockState.textContent='SEARCHING FOR BREATHBUDDY...';lockDetail.textContent=detail||'TAP SCREEN TO CONNECT';}
}
async function connectBluefy(){
  if(bleConnected)return;
  if(!navigator.bluetooth){setDeviceLock('searching','OPEN THIS SITE IN BLUEFY');return;}
  try{
    setDeviceLock('searching','CHOOSE BREATHBUDDY');
    bleDevice=await navigator.bluetooth.requestDevice({
      acceptAllDevices:true,
      optionalServices:[SERVICE_UUID]
    });
    setDeviceLock('connecting');
    bleDevice.addEventListener('gattserverdisconnected',onBleDisconnected);
    const server=await bleDevice.gatt.connect();
    const service=await server.getPrimaryService(SERVICE_UUID);
    bleCharacteristic=await service.getCharacteristic(CHARACTERISTIC_UUID);
    await bleCharacteristic.startNotifications();
    bleCharacteristic.addEventListener('characteristicvaluechanged',onBleValue);
    setDeviceLock('connected');
  }catch(err){console.error(err);setDeviceLock('searching','TAP SCREEN TO TRY AGAIN');}
}
deviceLock.addEventListener('click',connectBluefy);
async function tryKnownDevice(){
  if(!navigator.bluetooth){setDeviceLock('searching','OPEN THIS SITE IN BLUEFY');return;}
  if(typeof navigator.bluetooth.getDevices!=='function'){setDeviceLock('searching','TAP SCREEN TO CONNECT');return;}
  try{
    const devices=await navigator.bluetooth.getDevices();
    const known=devices.find(d=>d.name==='BreathBuddy')||devices[0];
    if(!known){setDeviceLock('searching','TAP SCREEN TO CONNECT');return;}
    bleDevice=known;setDeviceLock('connecting','RECONNECTING...');
    bleDevice.addEventListener('gattserverdisconnected',onBleDisconnected);
    const server=await bleDevice.gatt.connect();
    const service=await server.getPrimaryService(SERVICE_UUID);
    bleCharacteristic=await service.getCharacteristic(CHARACTERISTIC_UUID);
    await bleCharacteristic.startNotifications();
    bleCharacteristic.addEventListener('characteristicvaluechanged',onBleValue);
    setDeviceLock('connected');
  }catch(err){console.error(err);setDeviceLock('searching','TAP SCREEN TO CONNECT');}
}
function remain(){return !analysed||!deadline?600:Math.max(0,Math.ceil((deadline-Date.now())/1000))}
function clock(){const n=remain();return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function thirst(){if(!analysed)return'WAITING';const n=remain();return n>450?'FULL':n>240?'HAPPY':n>60?'THIRSTY':n>0?'PARCHED':'DEAD'}
function pint(){let dead=thirst()==='DEAD',s=states[state];return `<div class="pint-wrap ${dead?'dead':''}"><div class="pint"><div class="inner"><div class="beer" style="height:${analysed?s.fill:12}%"><div class="foam"></div></div><div class="shine"></div><div class="face">${dead?'×﹏×':s.face}</div></div></div></div>`}
function toast(msg){const old=document.getElementById('toast');if(old)old.remove();const t=document.createElement('div');t.id='toast';t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function stateFromReading(v){if(v<0.020)return 0;if(v<0.050)return 1;if(v<0.080)return 2;if(v<0.120)return 3;return 4}
function applyReading(v){if(!Number.isFinite(v))return;state=stateFromReading(v);analysed=true;deadline=Date.now()+600000;waitingForReading=false;page='result';render();toast('READING RECEIVED: '+v.toFixed(3))}
async function connectBreathBuddy(){
  if(!navigator.bluetooth){toast('WEB BLUETOOTH NOT SUPPORTED HERE');return}
  try{
    bleDevice=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[SERVICE_UUID]});
    bleDevice.addEventListener('gattserverdisconnected',onBleDisconnected);
    const server=await bleDevice.gatt.connect();
    const service=await server.getPrimaryService(SERVICE_UUID);
    bleCharacteristic=await service.getCharacteristic(CHARACTERISTIC_UUID);
    await bleCharacteristic.startNotifications();
    bleCharacteristic.addEventListener('characteristicvaluechanged',onBleValue);
    bleConnected=true;render();toast('🍺 BREATHBUDDY CONNECTED');
  }catch(err){console.error(err);toast('CONNECTION CANCELLED / FAILED')}
}
function onBleDisconnected(){bleConnected=false;bleCharacteristic=null;waitingForReading=false;setDeviceLock('disconnected')}
function onBleValue(e){
  const text=new TextDecoder().decode(e.target.value).trim();
  const value=parseFloat(text);
  console.log('BreathBuddy BLE:',text);
  if(waitingForReading)applyReading(value);
}
function weighted(){let total=drinks.reduce((a,x)=>a+x[1],0),r=Math.random()*total;for(const [n,w] of drinks){r-=w;if(r<=0)return n}return drinks[0][0]}
function home(){const s=states[state];el.innerHTML=`<div class="row"><b>PINT PAL</b><span class="pill">${analysed?s.name:'NOT ANALYSED'}</span></div><div class="row" style="margin-top:8px"><span class="small"><b>DEVICE:</b> CONNECTED</span><span class="pill">BLE</span></div>${pint()}<div class="statusbox"><div class="row"><span><b>THIRST</b><br><span class="big">${thirst()}</span></span><span style="text-align:right"><b>NEXT ANALYSIS</b><br><span class="timer">${clock()}</span></span></div><p class="center muted">${analysed?s.mood:'Do your first analysis to start the 10:00 timer.'}</p></div><p class="center"><b>LAST PICK:</b> ${lastDrink}</p><div class="actions"><button class="primary" onclick="showMenu()">MENU</button><button onclick="analyse()">ANALYSE</button></div>`;foot.textContent=thirst()==='DEAD'?'PINT PAL DIED • ANALYSE TO REVIVE':(bleConnected?'BREATHBUDDY CONNECTED • READY':'DRINK • BLOW • KEEP IT ALIVE')}
function showMenu(){page='menu';render()}
function menu(){el.innerHTML=`<div class="title">MAIN MENU</div><div class="menu"><button onclick="analyse()">ANALYSE BREATH<br><span class="small">Start/reset 10-minute timer</span></button><button onclick="dice()">ROLL FOR A DRINK<br><span class="small">Weighted random picker</span></button><button onclick="statusPage()">VIEW STATUS<br><span class="small">Timer + current state</span></button><button onclick="help()">HOW IT WORKS<br><span class="small">Quick guide</span></button><button onclick="goHome()">← BACK HOME</button></div>`;foot.textContent='TAP AN OPTION'}
function analyse(){
  page='analyse';render();
  if(bleConnected){
    waitingForReading=true;
    foot.textContent='WAITING FOR BREATHBUDDY READING';
    return;
  }
  let bar=document.getElementById('bar'),p=0;
  const t=setInterval(()=>{p+=4;if(bar)bar.style.width=p+'%';if(p>=100){clearInterval(t);state=weightedState();analysed=true;deadline=Date.now()+600000;page='result';render()}},70)
}
function weightedState(){const w=[28,25,22,17,8],t=w.reduce((a,b)=>a+b),r=Math.random()*t;let x=r;for(let i=0;i<w.length;i++){x-=w[i];if(x<=0)return i}return 0}
function analysing(){el.innerHTML=`<div class="title">ANALYSING...</div>${pint()}<div class="progress"><div id="bar"></div></div><p class="center"><b>${bleConnected?'WAITING FOR ESP32 READING...':'SIMULATING SENSOR READING...'}</b></p>`;foot.textContent=bleConnected?'BLE SENSOR MODE':'SIMULATION MODE'}
function result(){el.innerHTML=`<div class="title">ANALYSIS RESULT</div>${pint()}<div class="statusbox center"><div class="big">${states[state].name}</div><p>${states[state].mood}</p><b>NEXT ANALYSIS DUE IN 10:00</b></div><p class="note center">Prototype status only — not a BAC measurement.</p><div class="actions"><button onclick="goHome()">HOME</button><button class="primary" onclick="analyse()">ANALYSE AGAIN</button></div>`;foot.textContent='TIMER RESET'}
function dice(){page='dice';render()}
function dicePage(){el.innerHTML=`<div class="title">ROLL FOR A DRINK</div><p class="note center"><b>This picker is separate from your pint pal status.</b></p><div class="die" id="die">⚄</div><div class="drink" id="drink">${lastDrink}</div><div class="actions"><button onclick="goHome()">BACK</button><button class="primary" onclick="rollDrink()">ROLL</button></div><p class="note center">Beer, cider and mixers are more common. Straight spirits and shots are rarer.</p>`;foot.textContent='TAP ROLL'}
function rollDrink(){if(rolling)return;rolling=true;let i=0,d=document.getElementById('die'),out=document.getElementById('drink');const t=setInterval(()=>{d.textContent=['⚀','⚁','⚂','⚃','⚄','⚅'][Math.floor(Math.random()*6)];i++;if(i>12){clearInterval(t);lastDrink=weighted();out.textContent=lastDrink.toUpperCase();rolling=false;foot.textContent='TONIGHT\'S PICK: '+lastDrink.toUpperCase()}},70)}
function statusPage(){page='status';render()}
function status(){el.innerHTML=`<div class="title">STATUS</div>${pint()}<div class="statusbox"><div class="row"><b>ANALYSIS</b><span>${analysed?states[state].name:'NOT ANALYSED'}</span></div><hr><div class="row"><b>THIRST</b><span>${thirst()}</span></div><hr><div class="row"><b>NEXT ANALYSIS</b><span class="big">${clock()}</span></div><hr><div class="row"><b>LAST PICK</b><span>${lastDrink}</span></div></div><button style="width:100%;margin-top:15px;padding:14px;font:700 16px Courier New;border:3px solid var(--ink);background:var(--ink);color:var(--lcd)" onclick="goHome()">BACK HOME</button>`;foot.textContent='LIVE STATUS'}
function help(){page='help';render()}
function helpPage(){el.innerHTML=`<div class="title">HOW IT WORKS</div><div class="statusbox"><p><b>1.</b> Analyse to start or reset the 10-minute timer.</p><p><b>2.</b> Analysis sets the pint's status from NOT DRUNK to BLASTED.</p><p><b>3.</b> Roll for a Drink is a separate weighted picker and never changes the character.</p><p><b>4.</b> When the timer reaches zero, the pint pal dies.</p><p><b>5.</b> Analyse again to revive it.</p></div><p class="note">BLE mode can receive an experimental reading from BreathBuddy hardware. Simulation mode remains available when disconnected. Readings are prototype estimates only and must not be used to decide whether to drive.</p><button style="width:100%;padding:14px;font:700 16px Courier New;border:3px solid var(--ink);background:var(--ink);color:var(--lcd)" onclick="goHome()">BACK HOME</button>`;foot.textContent='QUICK GUIDE'}
function goHome(){page='home';render()}
function render(){if(page==='home')home();else if(page==='menu')menu();else if(page==='analyse')analysing();else if(page==='result')result();else if(page==='dice')dicePage();else if(page==='status')status();else helpPage()}
setInterval(()=>{if(page==='home'||page==='status')render()},1000);render();tryKnownDevice();
</script></body></html>
